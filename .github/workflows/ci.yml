name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  voice:
    name: Voice sidecar (chép lời thật)
    runs-on: windows-latest
    # Chép một file WAV mẫu bằng faster-whisper thật (model base, CPU) để bắt lỗi thư viện không tương thích.
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: resources/sidecar/requirements-voice.txt
      - run: python -m pip install --require-hashes --only-binary :all: -r resources/sidecar/requirements-voice.txt
      - uses: actions/cache@v4
        with:
          path: whisper-base
          key: faster-whisper-base-ebe41f70d5b6dfa9166e2c581c45c9c0cfc57b66
      - name: Tải model base (khoá commit + SHA-256)
        shell: pwsh
        run: |
          $rev = 'ebe41f70d5b6dfa9166e2c581c45c9c0cfc57b66'
          New-Item -ItemType Directory -Force whisper-base | Out-Null
          foreach ($f in 'model.bin', 'config.json', 'tokenizer.json', 'vocabulary.txt') {
            if (-not (Test-Path "whisper-base/$f")) { Invoke-WebRequest "https://huggingface.co/Systran/faster-whisper-base/resolve/$rev/$f" -OutFile "whisper-base/$f" }
          }
          $sha = (Get-FileHash whisper-base/model.bin -Algorithm SHA256).Hash.ToLower()
          if ($sha -ne 'd01c3014881c9c6f3133c182f3d2887eb6ca1c789a7538c5c007196857a0a6a9') { Remove-Item -Recurse whisper-base; Write-Error "Sai SHA-256: $sha"; exit 1 }
      - run: python resources/sidecar/tests/test_voice_server.py
        env:
          MMC_WHISPER_MODEL_DIR: whisper-base

  e2e:
    name: E2E smoke (Electron)
    runs-on: windows-latest
    needs: check
    # Cần project Supabase dev (anon key) để kiểm tra các trang team; PR từ fork không có secrets → bỏ qua.
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Tạo .env (project dev)
        shell: pwsh
        env:
          SUPABASE_URL: ${{ secrets.DEV_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.DEV_SUPABASE_ANON_KEY }}
        run: |
          if (-not $env:SUPABASE_URL) { Write-Error 'Thiếu secret DEV_SUPABASE_URL / DEV_SUPABASE_ANON_KEY'; exit 1 }
          "VITE_SUPABASE_URL=$env:SUPABASE_URL`nVITE_SUPABASE_ANON_KEY=$env:SUPABASE_ANON_KEY`nVITE_APP_ENV=development" | Out-File -Encoding utf8NoBOM .env
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-results
          path: test-results/
          retention-days: 7
