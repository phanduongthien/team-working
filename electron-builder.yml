# Đóng gói Windows (NSIS) + tự cập nhật qua GitHub Releases.
# Cấu hình publish (GitHub owner/repo) truyền qua -c.publish.* trong .github/workflows/release.yml,
# để build cục bộ không cần biết repo; bản build cục bộ vì vậy không tự cập nhật.
appId: com.youragent.teamworking
productName: Team Working
directories:
  buildResources: build
  output: release/${version}
files:
  - out/**
  - package.json
  - '!**/*.{md,map}'
extraResources:
  - from: src/main/db/migrations
    to: migrations
  - from: assistant-skills
    to: assistant-skills
  - from: resources/permission-mcp.cjs
    to: permission-mcp.cjs
asarUnpack:
  - node_modules/better-sqlite3/**
# better-sqlite3 dùng N-API kèm bản build sẵn — không cần biên dịch lại cho Electron.
npmRebuild: false
win:
  target: nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: ${name}-${version}-setup.${ext}
